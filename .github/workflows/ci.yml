name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:        
  test:
    name: Test
    runs-on: ubuntu-latest

    # Test on the 3 latest Elixir versions with the latest OTP version that each supports
    strategy:
      matrix:
        include:
          - elixir: 1.16.x
            otp: 26.x

          - elixir: 1.17.x
            otp: 27.x

          - elixir: 1.18.x
            otp: 28.x
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      
      - name: Install dependencies
        run: mix deps.get
      
      # We only check for warnings on latest Elixir version
      - name: Compile & lint
        run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}
      
      - name: Run tests
        run: mix test

  check-formatted:
    name: Check Formatted
    runs-on: ubuntu-latest

    # Check formatting on the latest Elixir version only
    strategy:
      matrix:
        include:
          - elixir: 1.18.x
            otp: 28.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check formatted
        run: mix format --check-formatted
